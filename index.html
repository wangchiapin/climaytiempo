<!-- ============ 純邏輯（不碰畫面，方便測試）============ -->
<script id="logic">
'use strict';
/* ---------- 拼音（數字調）→ 聲調符號、注音 ---------- */
const TONE_MARK = {a:'āáǎàa', e:'ēéěèe', i:'īíǐìi', o:'ōóǒòo', u:'ūúǔùu', v:'ǖǘǚǜü'};
function pyMarked(syl){
  const m = /^([a-z]+)([1-5])$/.exec(syl); if(!m) return syl;
  let s = m[1]; const t = +m[2]; let idx = -1;
  if(s.includes('a')) idx = s.indexOf('a');
  else if(s.includes('e')) idx = s.indexOf('e');
  else if(s.includes('ou')) idx = s.indexOf('o');
  else for(let i = s.length - 1; i >= 0; i--){ if('aeiouv'.includes(s[i])){ idx = i; break; } }
  let out = '';
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(i === idx && t !== 5) out += TONE_MARK[c][t - 1];
    else out += (c === 'v' ? 'ü' : c);
  }
  return out;
}
const ZY_INIT = {b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
const ZY_FIN = {a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',ong:'ㄨㄥ',er:'ㄦ',
  i:'ㄧ',ia:'ㄧㄚ',ie:'ㄧㄝ',iao:'ㄧㄠ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
  u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',uei:'ㄨㄟ',uan:'ㄨㄢ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
function pyToZy(syl){
  const m = /^([a-z]+)([1-5])$/.exec(syl); if(!m) return '';
  let s = m[1]; const tone = +m[2];
  if(s[0] === 'y'){ if(s[1] === 'i') s = s.slice(1); else if(s[1] === 'u') s = 'v' + s.slice(2); else s = 'i' + s.slice(1); }
  else if(s[0] === 'w'){ if(s[1] === 'u') s = s.slice(1); else s = 'u' + s.slice(1); }
  let ini = '', fin = s;
  if(/^(zh|ch|sh)/.test(s)){ ini = s.slice(0, 2); fin = s.slice(2); }
  else if(/^[bpmfdtnlgkhjqxrzcs]/.test(s)){ ini = s[0]; fin = s.slice(1); }
  if('jqx'.includes(ini) && ini && fin[0] === 'u') fin = 'v' + fin.slice(1);
  if(ini){ if(fin === 'iu') fin = 'iou'; else if(fin === 'ui') fin = 'uei'; else if(fin === 'un') fin = 'uen'; }
  if(['zh','ch','sh','r','z','c','s'].includes(ini) && fin === 'i') fin = '';
  if(fin !== '' && !(fin in ZY_FIN)) return '?' + syl;
  const zy = (ini ? ZY_INIT[ini] : '') + (fin === '' ? '' : ZY_FIN[fin]);
  return tone === 5 ? '˙' + zy : zy + ['', 'ˊ', 'ˇ', 'ˋ'][tone - 1];
}

/* ---------- 簡體對照（只用到的字）---------- */
const S2_FROM = '氣颱風雲陰霧溫熱涼悶這個點記帶傘會撐圍鏡陽曬長褲還沒選腳濕壞請報機質門來麼聞親訊媽學開遊戲設語純關級數題對錯試結儲暱稱連暫時無載讀歡準備簡體顯靜聲練習續錄總說話讓過與為們兩從圖號見覺買賣進現幫場週較參種聽裡變閉頁預類換';
const S2_TO   = '气台风云阴雾温热凉闷这个点记带伞会撑围镜阳晒长裤还没选脚湿坏请报机质门来么闻亲讯妈学开游戏设语纯关级数题对错试结储昵称连暂时无载读欢准备简体显静声练习续录总说话让过与为们两从图号见觉买卖进现帮场周较参种听里变闭页预类换';
const S2 = {}; for(let i = 0; i < S2_FROM.length; i++) S2[S2_FROM[i]] = S2_TO[i];

/* ---------- 句子零件 ---------- */
function T(zh, py, es, en){ return {segs:[{zh, py: py ? py.split(' ') : []}], es, en}; }
function PUN(zh, ch){ return {segs:[{zh, py:[], pun:true}], es:ch, en:ch, pun:true}; }
function cat(...parts){
  const segs = []; let es = '', en = '';
  parts.flat(Infinity).forEach(p => {
    if(!p) return;
    segs.push(...p.segs);
    if(p.es) es += (p.pun || !es ? '' : ' ') + p.es;
    if(p.en) en += (p.pun || !en ? '' : ' ') + p.en;
  });
  return {segs, es, en};
}
const upFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
function sent(parts, end){
  const c = cat(parts); const e = {'。':'.', '！':'!', '？':'?'}[end];
  c.segs.push({zh:end, py:[], pun:true});
  c.es = (end === '！' ? '¡' : '') + upFirst(c.es) + e;
  c.en = upFirst(c.en) + e;
  return c;
}
function para(...sents){
  const segs = []; const es = [], en = [];
  sents.flat(Infinity).forEach(s => { if(!s) return; segs.push(...s.segs); es.push(s.es); en.push(s.en); });
  return {segs, es: es.join(' '), en: en.join(' ')};
}
const C = PUN('，', ',');
const ZH_NUM = ['零','一','二','三','四','五','六','七','八','九','十'];
const PY_NUM = ['ling2','yi1','er4','san1','si4','wu3','liu4','qi1','ba1','jiu3','shi2'];
function numParts(n){
  if(n <= 10) return {zh: ZH_NUM[n], py: PY_NUM[n]};
  if(n < 20) return {zh: '十' + ZH_NUM[n - 10], py: 'shi2 ' + PY_NUM[n - 10]};
  const t = Math.floor(n / 10), o = n % 10;
  return {zh: ZH_NUM[t] + '十' + (o ? ZH_NUM[o] : ''), py: PY_NUM[t] + ' shi2' + (o ? ' ' + PY_NUM[o] : '')};
}
function N(n){ const p = numParts(n); return T(p.zh, p.py, String(n), String(n)); }
function NPCT(n){ const p = numParts(n); return T(p.zh, p.py, n + '%', n + '%'); }
const DEG = T('度', 'du4', 'grados', 'degrees');
const TEMP = n => cat(T('氣溫', 'qi4 wen1', 'la temperatura es de', 'the temperature is'), N(n), DEG);
const PROB = p => cat(T('降雨機率', 'jiang4 yu3 ji1 lv4', 'la probabilidad de lluvia es del', 'the chance of rain is'), T('百分之', 'bai3 fen1 zhi1', '', ''), NPCT(p));
const PERIOD = {
  morning: T('早上', 'zao3 shang4', 'por la mañana', 'in the morning'),
  afternoon: T('下午', 'xia4 wu3', 'por la tarde', 'in the afternoon'),
  evening: T('晚上', 'wan3 shang4', 'por la noche', 'in the evening')
};
const AIR = T('空氣品質不好', 'kong1 qi4 pin3 zhi2 bu4 hao3', 'la calidad del aire es mala', 'the air quality is poor');
const OH = T('喔', 'o1', '', '');
const dayPart = scn => scn.day === 'today' ? T('今天', 'jin1 tian1', 'hoy', 'today') : T('明天', 'ming2 tian1', 'mañana', 'tomorrow');

/* ---------- 規則：穿得對不對 ---------- */
function analyze(scn){
  const ps = scn.periods;
  return {
    minT: Math.min(...ps.map(p => p.t)), maxT: Math.max(...ps.map(p => p.t)),
    rain: ps.some(p => p.sky === 'rainy' || p.sky === 'typhoon'),
    typhoon: ps.some(p => p.sky === 'typhoon'),
    air: ps.some(p => p.air),
    sun: ps.some(p => p.sky === 'sunny' && p.t >= 28),
    multi: ps.length > 1
  };
}
let ALLOW_SKIRT = false;   // 只有女生角色的衣櫃有裙子（由畫面設定）
function check(o, scn){
  if(!o.top || !o.bottom || !o.shoes) return ['incomplete'];
  const a = analyze(scn), P = [], acc = o.acc || [];
  const has = id => acc.includes(id);
  const outerW = o.outer ? ITEMS[o.outer].w : 0;
  const extra = (has('scarf') ? 1 : 0) + (has('gloves') ? 1 : 0);
  const W = ITEMS[o.top].w + outerW + ITEMS[o.bottom].w + extra;
  const Wmin = a.minT <= 10 ? 7 : a.minT <= 15 ? 5 : a.minT <= 18 ? 4 : a.minT <= 21 ? 3 : 0;
  const Wmax = a.maxT >= 28 ? (a.multi ? 3 : 2) : a.maxT >= 23 ? 4 : 99;
  const Whot = a.multi ? W - outerW - extra : W;
  if(W < Wmin) P.push('cold');
  if(Whot > Wmax) P.push('hot');
  if(a.minT <= 15 && o.bottom !== 'pants') P.push('legsCold');
  else if(a.minT <= 21 && o.bottom === 'shorts') P.push('legsCold');
  if(!a.multi && a.maxT >= 28 && o.bottom === 'pants') P.push('legsHot');
  const open = o.shoes === 'sandals' || o.shoes === 'slippers';
  if(a.minT <= 15 && open) P.push('feetCold');   // 下雨穿拖鞋不算錯，只在答對時提醒（見 tips）
  if(a.typhoon){
    if(o.outer !== 'raincoat') P.push('needRaincoat');
    if(has('umbrella')) P.push('typhoonUmb');
  } else if(a.rain && !has('umbrella') && o.outer !== 'raincoat') P.push('needRain');
  if(a.sun && !(has('hat') || has('shades') || has('sunscreen'))) P.push('sun');
  if(a.air && !has('mask')) P.push('air');
  if(a.minT <= 10 && !(has('scarf') || has('gloves'))) P.push('needScarf');
  if(a.minT >= 16 && (has('scarf') || has('gloves'))) P.push('noScarf');
  if((o.outer === 'coat' && a.minT >= 16) || (o.top === 'sweater' && a.minT >= 22)) P.push('tooThick');
  return P;
}

  return T2;
}

const FORMATS = ['news', 'phone', 'push', 'friend'];
function genScenario(level, fmt, avoidName){
  const day = pick(['today', 'tomorrow']);
  let type, periods;
  const pool = level === 3 ? SWING_TYPES : BASE_TYPES;
  do { type = pick(pool); } while(type.name === avoidName && pool.length > 1);
  if(level === 3) periods = type.make(); else periods = [type.make()];
  return {level, day, fmt, type: type.name, periods};
}

function perClause(p, friend, withTemp){
  const mid = (p.sky === 'rainy' || p.sky === 'typhoon') ? SKY_FUT[p.sky] : feelPart(p.t, friend);
  return cat(PERIOD[p.when], mid, withTemp ? [C, TEMP(p.t)] : null);
}
function reminder(scn){
  const a = analyze(scn);
  const R = (zh, py, es, en) => cat(T('記得', 'ji4 de5', 'recuerda', 'remember to'), T(zh, py, es, en));
  if(a.typhoon) return R('穿雨衣', 'chuan1 yu3 yi1', 'ponerte el impermeable', 'wear a raincoat');

function buildNews(scn){
  const ps = scn.periods, p = ps[0], d = dayPart(scn), L = scn.level;
  if(L === 1){
    const s1 = p.sky === 'typhoon' ? sent([d, SKY_NOW.typhoon, C, STORM], '。')
      : sent([d, SKY_NOW[p.sky], C, T('天氣', 'tian1 qi4', '', 'and'), feelPart(p.t)], '。');
    return para(s1, p.air ? sent([AIR], '。') : null);

  if(L === 2) return para(sent([d, SKY_NOW[p.sky], C, TEMP(p.t)], '。'), sent([PROB(p.prob)], '。'), p.air ? sent([AIR], '。') : null);

}
function buildPhone(scn){

    const first = p.sky === 'typhoon' ? sent([d, TYPH, C, STORM], '。') : sent([d, feelPart(p.t), tail], '。');
    const r = reminder(scn);
    return para(first, p.air ? sent([AIR], '。') : null, r ? sent([r], '。') : null);
  }
  if(L === 2){
    const w = p.sky === 'typhoon' ? TYPH : p.sky === 'rainy' ? WILL : NOT;
    return para(sent([d, N(p.t), DEG, C, w], '。'), p.air ? sent([AIR], '。') : null);
  }
  const rp = ps.find(x => x.sky === 'rainy');
  return para(
    sent([d, PERIOD[ps[0].when], N(ps[0].t), DEG, C, PERIOD[ps[1].when], N(ps[1].t), DEG], '。'),
    rp ? sent([PERIOD[rp.when], WILL], '。') : null);
}

/* ---------- 找一組正確的穿法（答錯兩次時示範）---------- */
function subsets(arr, maxN){
  const out = [[]];
  for(let i = 0; i < arr.length; i++){ const n = out.length; for(let j = 0; j < n; j++) if(out[j].length < maxN) out.push(out[j].concat(arr[i])); }
  return out;
}
function allSolutions(scn){
  const accSets = subsets(BY_SLOT.acc, 3), out = [];
  for(const top of BY_SLOT.top) for(const outer of [null, ...BY_SLOT.outer]) for(const bottom of BY_SLOT.bottom.filter(b => b !== 'skirt' || ALLOW_SKIRT)) for(const shoes of BY_SLOT.shoes) for(const acc of accSets){
    const o = {top, outer, bottom, shoes, acc};
    if(check(o, scn).length === 0) out.push(o);
  }
  return out;
}
function solve(scn){
  const all = allSolutions(scn); if(!all.length) return null;
  const min = Math.min(...all.map(o => o.acc.length + (o.outer ? 1 : 0)));
  return pick(all.filter(o => o.acc.length + (o.outer ? 1 : 0) <= min + 1));
}

let VOICE = null;
const isMandarin = v => { const l = String((v && v.lang) || '').toLowerCase().replace(/_/g, '-'); if(l.indexOf('yue') === 0 || l.indexOf('zh-hk') === 0) return false; return l === 'zh' || l.indexOf('zh-') === 0 || l.indexOf('cmn') === 0; };
function pickVoice(){
  try{
    const ok = (speechSynthesis.getVoices() || []).filter(isMandarin);
    VOICE = ok.find(v => /zh[-_]tw/i.test(v.lang)) || ok.find(v => /tw|taiwan|臺灣|台灣/i.test(v.name)) || ok[0] || null;
  }catch(e){}
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW'; if(VOICE) u.voice = VOICE;
    u.rate = RATE_VALUE[Settings.rate] || 0.65;
    speechSynthesis.speak(u);
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){}
let AC = null;
function beep(freqs, dur){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * dur);
      g.gain.exponentialRampToValueAtTime(0.16, t + i * dur + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * dur + dur);
      o.connect(g); g.connect(AC.destination); o.start(t + i * dur); o.stop(t + i * dur + dur + 0.03);
    });
  }catch(e){}
}
const sfxOk = () => beep([660, 880], 0.14), sfxBad = () => beep([220, 170], 0.18);

function startGame(){
  ALLOW_SKIRT = G.char === 'girl';
  G.round = 0; G.score = 0; G.results = []; G.lastType = null; G.t0 = Date.now();
  const f = []; while(f.length < ROUNDS) f.push(...FORMATS.slice().sort(() => Math.random() - 0.5));
  G.deck = f.slice(0, ROUNDS);
  nextRound();
}
function nextRound(){
  G.round++;
  G.scn = genScenario(G.level, G.deck[G.round - 1], G.lastType); G.lastType = G.scn.type;
  G.phrase = say(G.scn);
  G.friend = rint(0, FRIEND_NAMES.length - 1);
  G.outfit = EMPTY(); G.phase = 'dress'; G.attempts = 0; G.peeked = false; G.revealed = false; G.mood = 'idle'; G.tab = 'top';
  buildPlay(); go('sPlay');
  setTimeout(playPhrase, 450);
}
const spoken = () => G.phrase.segs.map(s => s.zh).join('');
function playPhrase(){ speak(spoken()); }
function tabKey(s){ return {top:'tTop', outer:'tOuter', bottom:'tBottom', shoes:'tShoes', acc:'tAcc'}[s]; }
function buildPlay(){
  $('sPlay').innerHTML =
    '<div class="topbar"><span class="pill">' + esc(conv('第')) + ' ' + G.round + ' / ' + ROUNDS + '</span><span class="pill">⭐ <span id="scoreNow">' + G.score + '</span></span><span class="sp"></span><button class="iconbtn" id="bHome" aria-label="home">⌂</button><button class="iconbtn" id="bSet2" aria-label="settings">⚙</button></div>'
    + '<div class="play-wrap"><div>' + frameHTML()
    + '<div id="say"></div><div class="stage" id="stage"></div></div>'
    + '<div><div class="closet"><div class="rail"></div><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></div><div class="msg" id="msg"></div><div class="actions" id="actions"></div></div></div>';
  $('bListen').onclick = playPhrase;
  $('bPeek').onclick = () => { if(G.phase === 'done') return; G.peeked = true; renderSay(); };
  $('bHome').onclick = () => { try{ speechSynthesis.cancel(); }catch(e){} renderStart(); go('sStart'); };
  $('bSet2').onclick = openSettings;
  renderSay(); renderStage(); renderTabs(); renderGrid(); renderMsg(null); renderActions();
}
function renderSay(){
  const box = $('say'); if(!box) return;
  const showTxt = G.revealed || G.peeked;
  if(!showTxt){ box.innerHTML = ''; return; }
  const ph = G.phrase, scn = G.scn;
  let html = '<div class="card say-card say-' + scn.fmt + '" style="margin-top:8px"><div class="say">' + segsHTML(ph.segs) + (transOf(ph) ? '<div class="trl">' + esc(transOf(ph)) + '</div>' : '') + '</div>';
  if(G.revealed){
    html += '<div class="wicons">' + scn.periods.map(p => '<span class="wi">' + weatherIcon(p.sky, p.air) + '<span>' + (p.when ? esc(conv({morning:'早上', afternoon:'下午', evening:'晚上'}[p.when])) + ' ' : '') + p.t + '°C' + (scn.level > 1 && (p.sky === 'rainy' || p.sky === 'typhoon') ? ' · ' + p.prob + '%' : '') + '</span></span>').join('') + '</div>';
  }
  if(scn.fmt === 'friend'){
    const n = FRIEND_NAMES[G.friend];
    html = html.replace('<div class="say">', '<div style="font-size:.9rem;color:var(--ink2)">' + esc(conv('來自')) + ' ' + segsHTML(n.segs) + '</div><div class="say">');
  }
  box.innerHTML = html + '</div>';
}
function renderStage(){
  const st = $('stage'); if(!st) return;
  st.className = 'stage' + (G.mood === 'cold' ? ' shiver' : G.mood === 'happy' ? ' hop' : '');
  st.innerHTML = stageSVG(G.char, G.outfit, G.mood, G.scn ? G.scn.periods : null, !!G.revealed);
}
function renderTabs(){
  $('tabs').innerHTML = SLOTS.map(s => {
    const worn = s === 'acc' ? G.outfit.acc.length > 0 : !!G.outfit[s];
    return '<button class="tab ' + (G.tab === s ? 'on' : '') + '" data-tab="' + s + '">' + ui(tabKey(s)) + (worn ? '<span class="dot" style="background:' + (G.tab === s ? '#fff' : 'var(--accent)') + '"></span>' : '') + '</button>';
  }).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { G.tab = b.dataset.tab; renderTabs(); renderGrid(); });
}
function isWorn(id){ const it = ITEMS[id]; return it.slot === 'acc' ? G.outfit.acc.includes(id) : G.outfit[it.slot] === id; }
function renderGrid(){
  ALLOW_SKIRT = G.char === 'girl';
  $('grid').dataset.slot = G.tab;
  $('grid').innerHTML = BY_SLOT[G.tab].filter(id => id !== 'skirt' || G.char === 'girl').map(id => '<button class="item ' + (isWorn(id) ? 'on' : '') + '" data-id="' + id + '">' + iconSVG(id) + '<div>' + itemName(id) + '</div>' + (itemTr(id) ? '<small class="tr">' + esc(itemTr(id)) + '</small>' : '') + '</button>').join('');
  $('grid').querySelectorAll('[data-id]').forEach(b => b.onclick = () => onItem(b.dataset.id));
}
function onItem(id){
  if(G.phase === 'done') return;
  const it = ITEMS[id];
  speak(it.zh);
  if(it.slot === 'acc'){ const i = G.outfit.acc.indexOf(id); if(i >= 0) G.outfit.acc.splice(i, 1); else G.outfit.acc.push(id); }
  else G.outfit[it.slot] = G.outfit[it.slot] === id ? null : id;
  if(G.mood !== 'idle'){ G.mood = 'idle'; }
  if(G.phase === 'wrong') renderMsg(null);
  renderStage(); renderTabs(); renderGrid();
}
function msgHTML(kind, parts){
  return '<div class="msgbox ' + kind + '">' + parts.map(m => segsHTML(m.segs) + (transOf(m) ? '<div class="trl">' + esc(transOf(m)) + '</div>' : '')).join('<div style="height:4px"></div>') + '</div>';
}
function renderMsg(html){ const m = $('msg'); if(m) m.innerHTML = html || ''; }
function renderActions(){
  const a = $('actions'); if(!a) return;
  if(G.phase === 'done') a.innerHTML = '<button class="btn main" id="bNext">' + ui(G.round >= ROUNDS ? 'finish' : 'next') + '</button>';
  else a.innerHTML = '<button class="btn main" id="bGo">🚪 ' + ui('go') + '</button>';
  if($('bNext')) $('bNext').onclick = () => G.round >= ROUNDS ? endGame() : nextRound();
  if($('bGo')) $('bGo').onclick = onGo;
}
function onGo(){
  if(G.phase === 'done') return;
  const P = check(G.outfit, G.scn);
  G.revealed = false;
  if(!P.length){
    const pts = Math.max(0, (G.attempts === 0 ? 10 : 6) - (G.peeked ? 3 : 0));
    G.score += pts; G.results.push(pts); G.phase = 'done'; G.revealed = true; G.mood = 'happy'; sfxOk();
    renderMsg(msgHTML('ok', [pick(OKMSG)()]) + (tips(G.outfit, G.scn).length ? msgHTML('info', tips(G.outfit, G.scn).map(c => MSG[c]())) : '') + '<div class="big" style="font-size:1.3rem">+' + pts + ' ' + esc(Settings.lang === 'zh' ? conv('分') : (Settings.lang === 'es' ? 'pts' : 'pts')) + '</div>');
  } else if(G.attempts === 0){
    G.attempts = 1; G.phase = 'wrong'; sfxBad();
    const first = P.find(x => MOOD_OF[x]);
    G.mood = first ? MOOD_OF[first] : 'sad';
    renderMsg(msgHTML('bad', P.slice(0, 2).map(c => MSG[c]())) + '<div style="margin-top:6px;color:var(--ink2);font-size:.9rem">' + (Settings.lang === 'es' ? 'Cambia la ropa y vuelve a intentarlo.' : Settings.lang === 'en' ? 'Change your outfit and try again.' : esc(conv('換一換，再試一次。'))) + '</div>');
  } else {
    sfxBad();
    const sol = solve(G.scn);
    if(sol) G.outfit = {top: sol.top, outer: sol.outer, bottom: sol.bottom, shoes: sol.shoes, acc: sol.acc.slice()};
    G.score += 0; G.results.push(0); G.phase = 'done'; G.revealed = true; G.mood = 'sad';
    renderMsg('<div class="msgbox info"><b>' + ui('answer', {notr: true}) + '</b>' + (Settings.lang === 'zh' ? '' : '<small class="tr">' + esc(Settings.lang === 'es' ? UI.answer[1] : UI.answer[2]) + '</small>') + '</div>');
    setTimeout(() => { G.mood = 'happy'; renderStage(); }, 700);
  }
  $('scoreNow').textContent = G.score;
  renderSay(); renderStage(); renderTabs(); renderGrid(); renderActions();
}

/* ---------- 結束 ---------- */
function endGame(){
  const total = G.score * G.level;
  const best = +(lsGet('hg.weather.best') || 0); if(total > best) lsSet('hg.weather.best', String(total));
  $('sEnd').innerHTML = '<div class="card" style="margin-top:14px;text-align:center"><h1 style="margin-top:0">' + ui('done') + '</h1><div style="color:var(--ink2)">' + esc(conv('第' + ['一', '二', '三'][G.level - 1] + '關')) + ' · ' + G.score + ' / ' + (ROUNDS * 10) + '</div><div class="big">' + total + '</div><div>' + ui('score') + '</div>'
    + '<div id="saveNote" style="margin:10px 0;color:var(--ink2);min-height:1.4em">' + esc(uiTxt('loading')) + '</div>'
    + '<div class="row"><button class="btn main" id="bAgain" style="flex:1">' + ui('again2') + '</button></div><div class="links"><button class="btn ghost" id="bH2">⌂ ' + ui('home', {notr: true}) + '</button></div></div>';
  $('bAgain').onclick = startGame; $('bH2').onclick = () => { renderStart(); go('sStart'); };
  go('sEnd');
  const n = $('saveNote'); if(n) n.textContent = uiTxt('bestLbl') + ' ' + Math.max(total, best);
}

/* ---------- 設定視窗 ---------- */
function openModal(html){ $('sheet').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }
$('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
function openSettings(){
  const seg = (k, opts) => '<div class="seg">' + opts.map(o => '<button class="' + (Settings[k] === o ? 'on' : '') + '" data-k="' + k + '" data-v="' + o + '">' + ui(o === 'zh' ? 'zhOnly' : o, {notr: true}) + '</button>').join('') + '</div>';
  openModal('<h2 style="margin:0 0 6px">' + ui('settings', {notr: true}) + '</h2>'
    + '<div class="sect">' + ui('sScript', {notr: true}) + '</div>' + seg('script', ['trad', 'simp'])
    + '<div class="sect">' + ui('sLang', {notr: true}) + '</div>' + seg('lang', ['es', 'en', 'zh'])
    + '<div class="sect">' + ui('sPhon', {notr: true}) + '</div>' + seg('phon', ['pinyin', 'zhuyin', 'both', 'off'])
    + '<div class="sect">' + ui('sRate', {notr: true}) + '</div>' + seg('rate', ['slow', 'normal', 'fast'])
    + '<button class="btn main" id="bClose" style="width:100%;margin-top:6px">' + ui('close', {notr: true}) + '</button>');
  $('sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { Settings[b.dataset.k] = b.dataset.v; writeSettings(Settings); openSettings(); rerender(); });
  $('bClose').onclick = closeModal;
}
function applyPhon(){ document.body.dataset.phon = Settings.phon; }
applyPhon();
function rerender(){ applyPhon();
  if(CUR === 'sStart') renderStart();
  else if(CUR === 'sPlay'){ buildPlay(); }
}

/* ---------- 開始 ---------- */
document.body.classList.add('start');
renderStart();
window.__WO = {G, check, say, genScenario, solve, ITEMS};
</script>

<!-- ============ 每天一分鐘遊戲共用零件（來自 game-kit/parts）============ -->
<script>
/* ===== 找不到中文聲音的提示 ===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设置安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支持语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<script>
/* ===== 一鍵靜音（只關音樂和音效，不影響念字的語音）===== */
(function(){
  var KEY='hg.mute.quemepongo', MOUNT='', muted=false, masters=[];
  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;left:8px;bottom:22px;z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');
      b.title = b.ariaLabel = muted ? '開啟音樂和音效 · Activar música y efectos' : '靜音（音樂和音效）· Silenciar música y efectos'; apply(); }
    b.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; try{ localStorage.setItem(KEY, muted?'1':'0'); }catch(err){} paint(); });
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
</script>
